w-its-freezing-in-here-can-someone-nhi0yt.mp3","s":"Wow, it's freezing in here! Can someone close the window?","u":"ch-5-3"},{"p":"audio/speech/writing-pzhiz3.mp3","s":"writing","u":"sp-4-3"},{"p":"audio/speech/yellow-1let6x.mp3","s":"yellow","u":"sp-4-5, sk-1-3, wd-1-1…"},{"p":"audio/speech/yesterday-i-visited-my-aunt-and-we-b-m6k5el.mp3","s":"Yesterday, I visited my aunt and we baked cookies together.","u":"ch-4-2"}]},{"title":"5. Dialogues and listening recordings","spot":"all 15 longer Listening Island recordings + 10 dialogue lines","items":[{"p":"audio/female2/and-i-can-write-the-sentences-f0hh29.mp3","s":"And I can write the sentences.","u":"sk-5-1"},{"p":"audio/female2/good-morning-sara-how-are-you-today-4st7a3.mp3","s":"Good morning, Sara! How are you today?","u":"sk-2-1"},{"p":"audio/female2/i-love-basketball-what-about-you-kaalh3.mp3","s":"I love basketball! What about you?","u":"sk-5-4"},{"p":"audio/female2/im-very-well-thank-you-jy4k1v.mp3","s":"I'm very well, thank you.","u":"sk-2-1"},{"p":"audio/female2/its-name-is-snowy-2gsnwg.mp3","s":"Its name is Snowy.","u":"sk-4-5"},{"p":"audio/female2/of-course-here-you-are-qo9zzq.mp3","s":"Of course. Here you are.","u":"sk-2-4"},{"p":"audio/female2/of-course-lets-do-the-project-togeth-804k06.mp3","s":"Of course! Let's do the project together.","u":"sk-5-1"},{"p":"audio/female2/why-do-you-like-swimming-zv8jo2.mp3","s":"Why do you like swimming?","u":"sk-5-4"},{"p":"audio/female2/yes-i-do-i-have-a-white-cat-6rqsfb.mp3","s":"Yes, I do. I have a white cat.","u":"sk-4-5"},{"p":"audio/listening/li-3-1.mp3","s":"Jana: Hi, I'm Jana. Every morning, I wake up at half past six. / Jana: First, I wash my face and brush my teeth. / Jana: Then I put on my school uniform. / Jana: For breakfast, I eat an egg and some bread, and I drink a glass of milk. / Jana: My dad drives me to school at a quarter past seven.","u":"li-3-1"},{"p":"audio/listening/li-3-2.mp3","s":"Ms. Mona: Good morning, Lulu. Where is your homework? / Lulu: I'm sorry, Ms. Mona. I finished it, but I forgot it at home. / Ms. Mona: That's okay. Can you bring it tomorrow? / Lulu: Yes, I will. I'll put it in my bag tonight. / Ms. Mona: Good idea. Now please open your book to page twenty.","u":"li-3-2"},{"p":"audio/listening/li-3-3.mp3","s":"Bader: On Saturday, I went to the park with my family. / Bader: My little sister played on the slide, and I flew my new kite. / Bader: It was very windy, so my kite went very high. / Bader: At lunchtime, we had a picnic under a tree. We ate sandwiches and fruit. / Bader: In the evening, we went home. I was tired but happy.","u":"li-3-3"},{"p":"audio/listening/li-3-4.mp3","s":"Mom: Saad, can you read the shopping list, please? / Saad: Sure. We need milk, eggs, rice and some apples. / Mom: Good. Let's get the apples first. How many do we need? / Saad: The list says one kilo. Can I choose them? / Mom: Yes, choose red ones, please. I'll get the milk and the eggs. / Saad: Mom, can we buy some dates too? Grandma is visiting tomorrow. / Mom: That's a lovely idea. Yes, we can.","u":"li-3-4"},{"p":"audio/listening/li-3-5.mp3","s":"Weather reporter: Good morning! Here is the weather for today. / Weather reporter: In Riyadh, it will be sunny and very hot, with a temperature of thirty-eight degrees. Remember to drink lots of water. / Weather reporter: In Abha, it will be cloudy and cool, with some rain in the afternoon. Take an umbrella! / Weather reporter: In Jeddah, it will be warm and windy. It's a great day to fly a kite at the beach. / Weather reporter: Have a wonderful day!","u":"li-3-5"},{"p":"audio/listening/li-4-1.mp3","s":"Omar: Hi, Yazan! Are you free on Thursday afternoon? / Yazan: I think so. Why? / Omar: My dad has tickets for a football match. Do you want to come with us? / Yazan: Wow, yes! I'd love to. What time does it start? / Omar: It starts at five o'clock. We can pick you up at four. / Yazan: Great! I'll ask my mom tonight and tell you tomorrow. / Omar: Okay. Don't forget to wear your blue team shirt!","u":"li-4-1"},{"p":"audio/listening/li-4-2.mp3","s":"Ms. Hessa: Listen, everyone. Next Wednesday, our class is going on a trip to the science museum. / Ms. Hessa: We will leave school by bus at eight thirty and come back at one o'clock. / Ms. Hessa: Please bring a packed lunch and a bottle of water. You do not need money. / Student: Ms. Hessa, can we take photos in the museum? / Ms. Hessa: Yes, you can, but please don't touch the exhibits unless a sign says you can. / Ms. Hessa: And remember: your parents must sign the permission form by Monday.","u":"li-4-2"},{"p":"audio/listening/li-4-3.mp3","s":"Man: Excuse me. Can you tell me how to get to the library? / Woman: Of course. Go straight along this street until you see a bakery. / Woman: Turn left at the bakery. Then walk past the school. / Woman: The library is on your right, between the bank and the park. / Man: Is it far? / Woman: No, it's only about five minutes on foot. / Man: Thank you very much!","u":"li-4-3"},{"p":"audio/listening/li-4-4.mp3","s":"Hamza: Leen, what are you doing? / Leen: I'm painting a picture of the sea. Painting is my favorite hobby. / Hamza: It's beautiful! I can't paint very well. / Leen: What's your favorite hobby, Hamza? / Hamza: I collect stamps from different countries. I have more than two hundred now. / Leen: That's a lot! Which one is your favorite? / Hamza: A stamp from Japan with a red bird on it. Grandpa gave it to me.","u":"li-4-4"},{"p":"audio/listening/li-4-5.mp3","s":"Dalia: Hello? / Aunt Nawal: Hello, Dalia! It's Aunt Nawal. How are you? / Dalia: I'm fine, thank you, Auntie! / Aunt Nawal: I'm calling to invite your family to dinner on Friday evening at seven. / Dalia: That sounds lovely. Should we bring anything? / Aunt Nawal: Maybe some dessert? Your mom's cake is delicious! / Dalia: Okay! I'll tell Mom. See you on Friday!","u":"li-4-5"},{"p":"audio/listening/li-5-1.mp3","s":"Narrator: Rashed and his uncle were driving across the desert to visit their family's farm. / Narrator: Suddenly, the sky turned orange, and a strong wind began to blow. It was a sandstorm! / Narrator: Rashed's uncle stopped the car. \"We must wait here until it passes,\" he said. \"The car is our shelter.\" / Narrator: They closed the windows and waited. Outside, they could not see anything but sand. / Narrator: After one hour, the wind stopped. But the road was covered with sand. Rashed took out his compass. \"The farm is to the north,\" he said. / Narrator: They drove slowly north and arrived at the farm just before sunset. Everyone was happy to see them.","u":"li-5-1"},{"p":"audio/listening/li-5-2.mp3","s":"Zoo guide: Welcome to the giraffe house, everyone! Giraffes are the tallest animals in the world. / Zoo guide: An adult giraffe can be more than five meters tall. That's taller than a bus! / Zoo guide: Giraffes use their long necks to reach leaves at the tops of trees. Their tongues are about fifty centimeters long, and they are dark purple. / Zoo guide: Giraffes only sleep for a short time each day, often just a few minutes at a time. / Zoo guide: Each giraffe has its own special pattern of spots, just like your fingerprints. No two giraffes are the same.","u":"li-5-2"},{"p":"audio/listening/li-5-3.mp3","s":"Ghada: Hi, Shahad! How was your weekend? / Shahad: It was busy! On Friday, I volunteered with my mom at a charity. We packed food boxes for families. / Ghada: That's wonderful! How many boxes did you pack? / Shahad: More than one hundred! My arms were tired, but I felt proud. What about you? / Ghada: I stayed at home on Friday because I had a cold. But on Saturday, I felt better, so we went to the new science center. / Shahad: Oh, I want to go there! Was it good? / Ghada: It was amazing. Let's go together next weekend!","u":"li-5-3"},{"p":"audio/listening/li-5-4.mp3","s":"Asma: My grandparents live in a small village in the mountains of Al Baha. I visit them every summer. / Asma: Their stone house is at the top of a green valley. From the window, you can see farms built like steps on the hillside. These are called terraces. / Asma: In the morning, the air is cool and there is often fog between the mountains. My grandmother grows pomegranates and roses in her garden. / Asma: In the evening, the whole family sits outside and drinks tea. We can see thousands of stars because there are no city lights. / Asma: It is my favorite place in the world.","u":"li-5-4"},{"p":"audio/listening/li-5-5.mp3","s":"Principal: Good morning, students. Here are this week's announcements. / Principal: First, the English reading competition will be on Tuesday at ten o'clock in the school hall. Grades three, four and five will take part. / Principal: Second, because of the hot weather, the football match on Wednesday afternoon is canceled. It will happen next week instead. / Principal: Third, the school library will now be open after school until three thirty every day except Thursday. / Principal: Finally, congratulations to Class Four B for having the cleanest classroom this month. Well done, everyone!","u":"li-5-5"},{"p":"audio/male/excuse-me-mr-khalid-where-is-the-lib-12vm3o.mp3","s":"Excuse me, Mr. Khalid. Where is the library?","u":"sk-5-1"},{"p":"audio/male/hi-my-name-is-omar-whats-your-name-nfoqu4.mp3","s":"Hi! My name is Omar. What's your name?","u":"sk-2-2"},{"p":"audio/male/hi-turki-how-was-your-weekend-ikspaw.mp3","s":"Hi, Turki! How was your weekend?","u":"sk-5-5"},{"p":"audio/male/i-wake-up-at-six-then-i-pray-and-hav-5668fq.mp3","s":"I wake up at six. Then I pray and have breakfast.","u":"sk-5-3"},{"p":"audio/male/nice-to-meet-you-yusuf-981480.mp3","s":"Nice to meet you, Yusuf!","u":"sk-2-2"},{"p":"audio/male/of-course-how-many-would-you-like-4iz2u4.mp3","s":"Of course. How many would you like?","u":"sk-5-2"},{"p":"audio/male/really-what-did-you-do-there-bwxyex.mp3","s":"Really? What did you do there?","u":"sk-5-5"},{"p":"audio/male/thank-you-is-it-open-now-7l5swi.mp3","s":"Thank you. Is it open now?","u":"sk-5-1"},{"p":"audio/male/that-sounds-wonderful-fyl0wl.mp3","s":"That sounds wonderful!","u":"sk-5-5"},{"p":"audio/male/theyre-twelve-riyals-4fj9ty.mp3","s":"They're twelve riyals.","u":"sk-5-2"},{"p":"audio/male/what-time-do-you-wake-up-sami-7xx94e.mp3","s":"What time do you wake up, Sami?","u":"sk-5-3"},{"p":"audio/male2/hi-omar-my-name-is-yusuf-4zc63f.mp3","s":"Hi, Omar! My name is Yusuf.","u":"sk-2-2"},{"p":"audio/male2/i-wake-up-at-six-thirty-what-about-y-0mmk5p.mp3","s":"I wake up at six thirty. What about you?","u":"sk-5-3"},{"p":"audio/male2/it-was-great-i-visited-my-grandparen-oqnam4.mp3","s":"It was great! I visited my grandparents in Abha.","u":"sk-5-5"},{"p":"audio/male2/its-on-the-second-floor-next-to-the-qmhekf.mp3","s":"It's on the second floor, next to the computer room.","u":"sk-5-1"},{"p":"audio/male2/me-too-i-love-breakfast-1tt3dm.mp3","s":"Me too! I love breakfast.","u":"sk-5-3"},{"p":"audio/male2/nice-to-meet-you-too-7xui1u.mp3","s":"Nice to meet you, too!","u":"sk-2-2"},{"p":"audio/male2/we-walked-in-the-mountains-it-was-co-v7vjac.mp3","s":"We walked in the mountains. It was cool and green.","u":"sk-5-5"},{"p":"audio/male2/yes-its-open-until-two-oclock-jors33.mp3","s":"Yes, it's open until two o'clock.","u":"sk-5-1"},{"p":"audio/speech/because-its-fun-and-it-keeps-me-heal-gw1gtc.mp3","s":"Because it's fun, and it keeps me healthy.","u":"sk-5-4"},{"p":"audio/speech/excuse-me-mom-can-i-have-an-apple-pl-oi9v8g.mp3","s":"Excuse me, Mom. Can I have an apple, please?","u":"sk-2-4"},{"p":"audio/speech/good-afternoon-id-like-some-oranges-xviq5s.mp3","s":"Good afternoon. I'd like some oranges, please.","u":"sk-5-2"},{"p":"audio/speech/good-morning-ms-huda-enqzo5.mp3","s":"Good morning, Ms. Huda!","u":"sk-2-1"},{"p":"audio/speech/great-idea-i-can-draw-the-pictures-u6yqq1.mp3","s":"Great idea! I can draw the pictures.","u":"sk-5-1"},{"p":"audio/speech/here-you-are-thank-you-c7s20a.mp3","s":"Here you are. Thank you!","u":"sk-5-2"},{"p":"audio/speech/hi-dana-can-i-sit-with-you-j15pzq.mp3","s":"Hi, Dana! Can I sit with you?","u":"sk-5-1"},{"p":"audio/speech/i-dont-like-basketball-very-much-i-l-uve7g4.mp3","s":"I don't like basketball very much. I like swimming.","u":"sk-5-4"},{"p":"audio/speech/six-please-how-much-are-they-krpmix.mp3","s":"Six, please. How much are they?","u":"sk-5-2"},{"p":"audio/speech/whats-your-favorite-sport-joud-1pokj5.mp3","s":"What's your favorite sport, Joud?","u":"sk-5-4"}]},{"title":"6. Story narrations (50)","spot":"10 passages, 2 per level","items":[{"p":"audio/reading/st-1-1.mp3","s":"My Red Bag. I have a red bag. My bag is big. I put my book in my bag. I love my red bag!","u":"st-1-1"},{"p":"audio/reading/st-1-10.mp3","s":"My Room. This is my room. I have a bed and a lamp. My books are on a shelf. I like my room.","u":"st-1-10"},{"p":"audio/reading/st-1-2.mp3","s":"A Little Cat. This is my cat. My cat is little. It is white. It likes milk. It sleeps on my bed.","u":"st-1-2"},{"p":"audio/reading/st-1-3.mp3","s":"My Family. This is my family. I have a mom and a dad. I have one brother and one sister. We are happy.","u":"st-1-3"},{"p":"audio/reading/st-1-4.mp3","s":"The Blue Ball. Sami has a blue ball. He kicks the ball. The ball goes up, up, up! Sami runs and gets it.","u":"st-1-4"},{"p":"audio/reading/st-1-5.mp3","s":"At School. I go to school. I have a desk and a chair. My teacher is kind. I read and I write.","u":"st-1-5"},{"p":"audio/reading/st-1-6.mp3","s":"My Apple. I have an apple. It is red and round. I wash my apple. Then I eat it. Yum!","u":"st-1-6"},{"p":"audio/reading/st-1-7.mp3","s":"A Sunny Day. It is a sunny day. The sky is blue. We go to the park. We play and we smile.","u":"st-1-7"},{"p":"audio/reading/st-1-8.mp3","s":"My Toy. My toy is a car. It is small and yellow. It has four wheels. It goes fast!","u":"st-1-8"},{"p":"audio/reading/st-1-9.mp3","s":"The Small Bird. I see a small bird. It is in a tree. The bird is brown. It sings a song.","u":"st-1-9"},{"p":"audio/reading/st-2-1.mp3","s":"A Day at the Park. On Friday, Lina goes to the park with her dad. She plays on the swings. Then she eats a sandwich under a big tree. A small bird sings. Lina has a happy day.","u":"st-2-1"},{"p":"audio/reading/st-2-10.mp3","s":"My Best Friend. My best friend is Noura. She is in my class. She has long black hair and a big smile. We sit together and share our snacks. Noura is kind and funny.","u":"st-2-10"},{"p":"audio/reading/st-2-2.mp3","s":"My School Morning. I wake up at six o'clock. I wash my face and brush my teeth. I put on my uniform. I eat bread and cheese for breakfast. Then my mom drives me to school.","u":"st-2-2"},{"p":"audio/reading/st-2-3.mp3","s":"The Lost Pencil. Omar cannot find his pencil. He looks in his bag. It is not there. He looks under his desk. It is not there. Then his friend Ali smiles. \"Your pencil is behind your ear!\" he says.","u":"st-2-3"},{"p":"audio/reading/st-2-4.mp3","s":"My Favorite Food. My favorite food is kabsa. It has rice, chicken and vegetables. My grandma makes the best kabsa. We eat it together on Fridays. It smells so good!","u":"st-2-4"},{"p":"audio/reading/st-2-5.mp3","s":"A Visit to Grandma. Today we visit Grandma. Her house is near the sea. Grandma gives us dates and juice. She tells us a funny story. We laugh a lot. I love visiting Grandma.","u":"st-2-5"},{"p":"audio/reading/st-2-6.mp3","s":"The Little Rabbit. A little rabbit lives in a garden. It has long ears and a short tail. Every morning, it eats green leaves and carrots. When it sees a cat, it hops away fast!","u":"st-2-6"},{"p":"audio/reading/st-2-7.mp3","s":"My New Shoes. Yesterday, I got new shoes. They are black and white. They are very comfortable. I wear them to school. Now I can run fast in the playground!","u":"st-2-7"},{"p":"audio/reading/st-2-8.mp3","s":"A Rainy Day. It is raining today. We cannot play outside. My sister and I stay at home. We draw pictures and build a tower with blocks. After the rain, we see a rainbow!","u":"st-2-8"},{"p":"audio/reading/st-2-9.mp3","s":"Helping at Home. I like to help my family. I make my bed every morning. I put my toys away. I help my dad wash the car. My mom says, \"Thank you, my helper!\"","u":"st-2-9"},{"p":"audio/reading/st-3-1.mp3","s":"A Surprise for Mom. Tomorrow is Mom's birthday. Reem and her brother want to surprise her. Reem draws a beautiful card with flowers. Her brother helps Dad bake a chocolate cake. In the evening, they turn off the lights. When Mom comes in, they shout, \"Surprise!\" Mom smiles and hugs them. \"This is the best birthday ever!\" she says.","u":"st-3-1"},{"p":"audio/reading/st-3-10.mp3","s":"A Visit to the Library. On Tuesday, our class visited the school library. The librarian, Ms. Amal, showed us where to find books about animals, space and stories. She told us to be quiet and to look after the books. I chose a book about dolphins. You can borrow a book for one week. I can't wait to read mine!","u":"st-3-10"},{"p":"audio/reading/st-3-2.mp3","s":"The School Garden. Our school has a small garden. Every week, our class takes care of it. We water the plants and pull out the weeds. Last month, we planted tomato seeds. Now there are small green plants. Soon, they will have red tomatoes. Our teacher says a garden teaches us to be patient.","u":"st-3-2"},{"p":"audio/reading/st-3-3.mp3","s":"A Helpful Friend. Faisal fell down in the playground and hurt his knee. He started to cry. His friend Saad ran to him. \"Are you okay?\" Saad asked. He helped Faisal stand up and walked with him to the school nurse. The nurse cleaned the knee and put on a bandage. \"Thank you, Saad,\" said Faisal. \"You are a true friend.\"","u":"st-3-3"},{"p":"audio/reading/st-3-4.mp3","s":"Life in the Desert. A desert is a very dry place. It does not rain much there. In the day, the desert is very hot, but at night it can be cold. Some animals live in the desert. Camels can walk for many days without water. Their wide feet help them walk on the sand. Desert foxes have big ears that help them stay cool.","u":"st-3-4"},{"p":"audio/reading/st-3-5.mp3","s":"The Missing Book. Huda could not find her library book. She had to return it today! She looked on her desk, under her bed and in her school bag. Then she remembered. Last night, she read the book in the kitchen. She ran to the kitchen. There it was, next to the fruit bowl! Huda put it in her bag right away.","u":"st-3-5"},{"p":"audio/reading/st-3-6.mp3","s":"How Plants Grow. A plant starts as a small seed. When we put the seed in soil and give it water, it begins to grow. First, roots grow down into the soil. Then a small green shoot grows up toward the light. Leaves open and use sunlight to make food for the plant. Plants need water, sunlight, air and soil to grow well.","u":"st-3-6"},{"p":"audio/reading/st-3-7.mp3","s":"A Busy Saturday. Saturday was a busy day for Khalid. In the morning, he helped his mother clean the house. At noon, he went to the market with his father to buy fruit and vegetables. In the afternoon, he played football with his cousins. In the evening, he was very tired. He ate dinner and went to bed early.","u":"st-3-7"},{"p":"audio/reading/st-3-8.mp3","s":"Why We Need Water. All living things need water. People, animals and plants cannot live without it. Our bodies use water to stay cool and healthy. We should drink water every day, especially when it is hot. Plants use water to grow. Water is very important, so we must not waste it. Turn off the tap when you brush your teeth!","u":"st-3-8"},{"p":"audio/reading/st-3-9.mp3","s":"The Little Explorer. Yusuf loves to explore. One day, he took his magnifying glass into the garden. He looked at a leaf and saw tiny lines on it. He watched a line of ants carrying food. Under a rock, he found a small beetle. Yusuf drew everything in his notebook. \"I want to be a scientist one day,\" he said.","u":"st-3-9"},{"p":"audio/reading/st-4-1.mp3","s":"The Class Clean-Up. After the school sports day, the playground was full of rubbish. There were empty bottles, paper cups and food wrappers everywhere. Ms. Sara looked at her class. \"What can we do?\" she asked. \"Let's clean it up!\" said Jana. The students put on gloves and took big bags. Some picked up bottles. Others collected paper. In thirty minutes, the playground was clean again. The principal came to see. \"I am proud of you,\" she said. \"You took care of our school.\" The students felt proud too.","u":"st-4-1"},{"p":"audio/reading/st-4-10.mp3","s":"A Wonderful Team. Ms. Nada gave her class a big project: build a model of a town. She put the students into teams of four. In Leen's team, everyone wanted to do the same job. They all wanted to paint! Soon they were arguing. Then Leen had an idea. \"Let's each choose a job we are good at,\" she said. Maya built the houses. Hala made the roads. Sara made trees from paper, and Leen painted the signs. On Thursday, their town won first prize. \"You were a wonderful team,\" said Ms. Nada.","u":"st-4-10"},{"p":"audio/reading/st-4-2.mp3","s":"The Amazing Honeybee. Honeybees are small insects, but they do very important work. They live together in a hive. Each hive has one queen bee and thousands of worker bees. Worker bees fly from flower to flower to collect a sweet liquid called nectar. They take the nectar back to the hive and turn it into honey. When bees visit flowers, they also carry pollen from one flower to another. This helps new fruits and seeds grow. Without bees, we would have much less fruit to eat. That is why bees are amazing!","u":"st-4-2"},{"p":"audio/reading/st-4-3.mp3","s":"An Adventure in the Mountains. In the summer, Majid's family drove to the mountains near Abha. The air was cool and fresh, and the hills were green. They decided to walk up a mountain path. Halfway up, Majid saw a group of baboons sitting on the rocks. \"Don't feed them,\" said his father. \"They are wild animals.\" Majid took a photo from far away. At the top, the family sat down and looked at the clouds below them. Majid felt like he was on top of the world. It was the best day of the holiday.","u":"st-4-3"},{"p":"audio/reading/st-4-4.mp3","s":"Making Healthy Choices. Every day, we make choices that help our bodies stay strong and healthy. One healthy choice is eating different kinds of food. Fruit and vegetables give us vitamins. Bread and rice give us energy. Milk helps our bones and teeth grow strong. It is also important to drink plenty of water and to sleep for about ten hours every night. Exercise is another good choice. Running, swimming and playing outside make our hearts strong. Too many sweets and fizzy drinks are not good for our teeth.","u":"st-4-4"},{"p":"audio/reading/st-4-5.mp3","s":"A Day Without Electricity. One evening, all the lights in Ahmed's house suddenly went off. The TV stopped, the fan stopped, and the house was dark and quiet. \"The electricity is off in our street,\" said Mom. At first, Ahmed was upset. He could not play his video game. Then Dad found a flashlight and some candles. The family sat together on the floor. Grandpa told stories about when he was a boy, before every house had electricity. When the lights came back on, Ahmed was surprised. \"Can we do that again tomorrow?\" he asked.","u":"st-4-5"},{"p":"audio/reading/st-4-6.mp3","s":"The Kind Neighbor. Mr. Saleh lives next door to Rana's family. He is old, and he lives alone. One day, Rana saw him carrying heavy bags of shopping. She ran to help him. After that, Rana visited Mr. Saleh every week with her mother. They brought him bread and checked if he needed anything. Mr. Saleh taught Rana how to grow mint in small pots. When Rana was sick for a week, Mr. Saleh sent her a pot of fresh mint and a card. It said, \"Get well soon, my young friend.\" Rana smiled. Kindness had come back to her.","u":"st-4-6"},{"p":"audio/reading/st-4-7.mp3","s":"Life Under the Sea. The Red Sea is home to thousands of kinds of fish and other sea animals. Many of them live near coral reefs. A coral reef may look like colorful rocks, but it is made by tiny animals called corals. Coral reefs give fish food and safe places to hide. Clownfish hide inside sea anemones. Turtles swim slowly and eat sea grass. Some fish are as small as a fingernail, and some sharks are longer than a car. Coral reefs are in danger when the sea gets too warm or dirty. We can help by keeping beaches clean.","u":"st-4-7"},{"p":"audio/reading/st-4-8.mp3","s":"The School Competition. Our school had a reading competition. Every student who read ten books in one month would get a gold star. Bader loved football, but he did not like reading very much. His teacher gave him a book about a famous football player. Bader read it in two days! Then he read books about sports, animals and inventions. He found that reading could be exciting. At the end of the month, Bader had read twelve books. He did not just win a gold star. He found a new hobby.","u":"st-4-8"},{"p":"audio/reading/st-4-9.mp3","s":"Saving Water. Saudi Arabia is a hot country with very few rivers and not much rain. Much of our water comes from the sea. Factories take the salt out of sea water so that people can drink it. This takes a lot of energy and money. That is why every drop of water is precious. We can all help to save water. Turn off the tap while you brush your teeth. Take shorter showers. Water plants in the evening, when it is cooler. Tell an adult if you see a dripping tap.","u":"st-4-9"},{"p":"audio/reading/st-5-1.mp3","s":"The Young Inventor. Ten-year-old Ziad noticed a problem. Every afternoon, his grandmother forgot to water her plants, and many of them dried out in the summer heat. Ziad wanted to help, but he went to school every day. He decided to invent something. He took an old plastic bottle, made tiny holes in the cap, and filled it with water. Then he turned the bottle upside down and pushed it into the soil next to a plant. Slowly, drop by drop, the water went into the soil. His first bottle leaked too fast, so he made the holes smaller. After three tries, it worked perfectly. Grandma's plants stayed green all summer. Ziad's teacher asked him to show his invention to the whole class. \"Every invention starts with a problem,\" she said.","u":"st-5-1"},{"p":"audio/reading/st-5-10.mp3","s":"Small Actions, Big Changes. Many people think that one person cannot change the world. But small actions, done by many people, can make a big difference. Imagine one student who turns off the classroom lights when everyone leaves. That saves a little electricity. Now imagine every student in every school doing the same thing. Together, they could save enough electricity to power thousands of homes. It is the same with rubbish. If one person picks up one piece of litter each day, that is 365 pieces in a year. If a whole class does it, that is more than ten thousand pieces! You can start today. Use both sides of your paper. Carry a water bottle instead of buying plastic ones. Plant a tree with your family. Your small actions, added to other people's, can help change the world.","u":"st-5-10"},{"p":"audio/reading/st-5-2.mp3","s":"Exploring Saudi Arabia. Saudi Arabia is the largest country on the Arabian Peninsula. Its capital city is Riyadh. The country has many different landscapes, and each region is special. In the east and the south, there are huge sandy deserts. The Empty Quarter is one of the largest sand deserts in the world. In the southwest, the mountains of Asir are cool and green, with terraced farms on the hillsides. The Red Sea lies along the west coast. Its warm, clear water is full of coral reefs. On the east coast is the Arabian Gulf. In the north, near AlUla, visitors can see huge rocks and ancient tombs carved into stone thousands of years ago. From deserts to mountains and seas, Saudi Arabia has something amazing for every explorer.","u":"st-5-2"},{"p":"audio/reading/st-5-3.mp3","s":"The Importance of Recycling. Every day, people throw away a huge amount of rubbish. Some of it goes to big holes in the ground called landfills. Plastic in a landfill can take hundreds of years to break down. Recycling means turning used things into new things. Old paper can become new paper or cardboard. Glass bottles can be melted and made into new bottles. Aluminum cans can be recycled again and again. Recycling helps our planet in many ways. It means fewer trees are cut down to make paper. It uses less energy than making things from new materials. It also keeps rubbish out of the sea, where it can hurt fish and turtles. You can help by sorting your rubbish at home and at school. Remember: reduce, reuse, recycle!","u":"st-5-3"},{"p":"audio/reading/st-5-4.mp3","s":"The Brave Little Explorer. Dana was the smallest girl in her class, and she was afraid of many things: the dark, big dogs, and speaking in front of people. When her class went on a trip to a cave, she almost stayed home. Inside the cave, it was dark and cool. The guide gave everyone a flashlight. Suddenly, a younger boy from another school started to cry. He had lost his group. Dana forgot about her own fear. She took his hand and said, \"Don't worry. We will find them together.\" She shined her flashlight along the wall and saw arrows painted on the rock. \"Follow the arrows!\" she said. Soon they found the boy's teacher. Later, Dana told the whole class what happened. She was not afraid to speak. She had learned that being brave means doing something even when you feel scared.","u":"st-5-4"},{"p":"audio/reading/st-5-5.mp3","s":"Working Together. Near a big rock lived a colony of ants. One day, a strong wind blew a large leaf on top of their nest. The entrance was blocked, and the ants inside could not get out. A big ant tried to push the leaf away, but it did not move. A fast ant tried to dig around it, but the sand kept falling back. Each ant tried alone, and each ant failed. Then the oldest ant called everyone together. \"Alone, we are small,\" she said. \"Together, we are strong.\" She asked fifty ants to stand on one side of the leaf. \"Push on three. One, two, three!\" Slowly, the leaf began to slide. With one more big push, it fell off the nest. The ants cheered. From that day on, whenever there was a problem, they remembered the words of the oldest ant.","u":"st-5-5"},{"p":"audio/reading/st-5-6.mp3","s":"How Animals Adapt. Animals live in many different places, from icy lands to hot deserts. Over a very long time, their bodies have changed to help them survive where they live. These changes are called adaptations. Polar bears live in the freezing Arctic. They have thick fur and a layer of fat under their skin to keep them warm. Their white fur also helps them hide in the snow. Camels live in hot, dry deserts. Many people think a camel's hump is full of water, but it is really full of fat. The camel's body can use this fat when there is little food. Long eyelashes protect their eyes from blowing sand. Fennec foxes have very large ears. Their ears help heat leave their bodies, so they stay cool. Every adaptation helps an animal live in its home.","u":"st-5-6"},{"p":"audio/reading/st-5-7.mp3","s":"The Science Fair. Every year, our school holds a science fair. This year, my partner Lama and I wanted to find out which material keeps ice frozen the longest. We put the same size ice cube into four cups. We wrapped one cup in foil, one in cloth, one in newspaper, and left one with no cover. Every ten minutes, we checked the ice and wrote down what we saw. The ice in the open cup melted first, after forty minutes. The cup wrapped in cloth kept its ice the longest — almost two hours! We made a chart to show our results. We did not win first place, but the judges liked our clear chart. The best part was that we did a real experiment, just like real scientists. Next year, we want to test which plants grow fastest.","u":"st-5-7"},{"p":"audio/reading/st-5-8.mp3","s":"A Journey Through Space. In her dream, Mariam put on a space suit and climbed into a rocket. \"Three, two, one… lift off!\" The rocket shook and roared into the sky. Soon Mariam was floating inside the spaceship. Through the window, she saw Earth, a beautiful blue and white ball. Next, she passed the Moon, gray and covered with round craters. Then she flew to Mars, the red planet. Its red color comes from rusty dust on the ground. Far away, she saw Saturn and its wide, shining rings. Everywhere around her, millions of stars sparkled in the darkness. Suddenly, she heard her mother's voice. \"Mariam, time for school!\" She opened her eyes. It was only a dream, but now Mariam knew what she wanted to be: an astronaut.","u":"st-5-8"},{"p":"audio/reading/st-5-9.mp3","s":"Learning From Mistakes. Abdullah joined the school music club and started to learn the oud. At first, he made so many mistakes. His fingers pressed the wrong strings, and the music sounded terrible. After one week, he wanted to quit. His teacher, Mr. Fahad, smiled. \"Do you know how many mistakes I made when I started?\" he asked. \"Thousands! Every mistake teaches you something.\" Abdullah decided to keep trying. Each day, he practiced for twenty minutes. When he made a mistake, he played the part again slowly. Little by little, the music became better. Three months later, Abdullah played a song at the school concert. He made one small mistake, but he did not stop. He kept playing and smiled. Everyone clapped. He had learned that mistakes are part of learning.","u":"st-5-9"}]},{"title":"7. Second dialogue voices (new)","spot":"5 recordings","items":[]},{"title":"8. Slow models","spot":"10 recordings","items":[{"p":"audio/slow/a-big-dog-vu9z4k.mp3","s":"a big dog","u":"sk-1-5"},{"p":"audio/slow/a-red-ball-9m9hl4.mp3","s":"a red ball","u":"sk-1-5"},{"p":"audio/slow/after-school-i-do-my-homework-kyo1yr.mp3","s":"After school, I do my homework.","u":"sk-5-3"},{"p":"audio/slow/afternoon-brhct3.mp3","s":"afternoon","u":"sk-4-3"},{"p":"audio/slow/ball-ekzuxw.mp3","s":"ball","u":"
